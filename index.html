<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>

    <link rel="stylesheet" href="src/assets/css/output.css">
    <link rel="stylesheet" href="src/icon/style.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">


    <main class="min-h-screen px-4 py-8 sm:py-12">

        <div class="mx-auto w-full max-w-6xl">

            <!-- Header -->
            <header class="mb-8 text-center">
                <div
                    class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-100 text-blue-700">
                    <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="3" />
                        <path d="M3 10h18" />
                    </svg>
                </div>

                <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
                    Secure Payment
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Enter your card details to continue
                </p>
            </header>

            <!-- Main Layout -->
            <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-2">

                <!-- Left Box: Card Preview + Saved Cards -->
                <section class="min-w-0 rounded-3xl border border-slate-200 bg-white p-5 shadow-xl sm:p-7">

                    <h2 class="mb-5 text-lg font-bold text-slate-900">
                        Card Preview
                    </h2>

                    <!-- Bank Card -->
                    <div class="card relative mb-7 aspect-[1.6/1] w-full overflow-hidden rounded-2xl shadow-lg">

                        <img src="src/img/Modern Navy Contactless Card Template.png" alt="Bank card preview"
                            class="absolute inset-0 h-full w-full object-cover">

                        <div class="absolute inset-0 bg-linear-to-t from-slate-950/50 via-transparent to-transparent">
                        </div>

                        <div class="absolute left-5 top-5 text-xs font-medium uppercase tracking-[0.2em] text-white/80">
                            Premium Card
                        </div>

                        <h2 id="cardNumber"
                            class="absolute bottom-[29%] left-5 right-3 text-[clamp(15px,4vw,25px)] font-semibold tracking-wider text-white drop-shadow-md">
                            0000-0000-0000-0000
                        </h2>

                        <div class="absolute bottom-5 left-5 right-5 flex items-end justify-between text-white">

                            <div class="min-w-0">
                                <p class="mb-1 text-[9px] uppercase tracking-[0.2em] text-white/70">
                                    Card Holder
                                </p>

                                <h3 id="name"
                                    class="truncate text-sm font-semibold uppercase tracking-wider sm:text-base">
                                    YOUR NAME
                                </h3>
                            </div>

                            <div class="shrink-0 text-right">
                                <p class="mb-1 text-[12px] uppercase tracking-[0.15em] text-white/90">
                                    Expires
                                </p>

                                <p class="text-lg font-medium tracking-wider">
                                    <span id="cardYear">YY</span>/<span id="cardMonth">MM</span>
                                </p>
                            </div>

                        </div>
                    </div>

                    <!-- Saved Cards -->
                    <section class="saved-cards border-t border-slate-200 pt-6">

                        <div class="mb-4 flex items-center justify-between gap-3">

                            <div>
                                <h2 class="text-lg font-bold text-slate-900">
                                    Saved Cards
                                </h2>

                                <p class="mt-1 text-xs text-slate-500">
                                    Choose a card to fill the preview
                                </p>
                            </div>

                            <span
                                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-100 text-blue-700">
                                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="5" width="20" height="14" rx="2" />
                                    <path d="M2 10h20" />
                                </svg>
                            </span>

                        </div>

                        <ul id="cardList"
                            class="space-y-3 [&>li]:flex [&>li]:cursor-pointer [&>li]:items-center [&>li]:justify-between [&>li]:gap-3 [&>li]:rounded-xl [&>li]:border [&>li]:border-slate-200 [&>li]:bg-white [&>li]:p-4 [&>li]:text-sm [&>li]:font-medium [&>li]:text-slate-700 [&>li]:transition [&>li:hover]:border-blue-300 [&>li:hover]:bg-blue-50 [&>li:hover]:text-blue-800">
                        </ul>

                        <p class="mt-3 text-xs leading-5 text-slate-400">
                            Only use fictional card details in this educational demo.
                        </p>

                    </section>

                </section>

                <!-- Right Box: Payment Form -->
                <section class="min-w-0 rounded-3xl border border-slate-200 bg-white p-5 shadow-xl sm:p-7">

                    <h2 class="mb-6 text-lg font-bold text-slate-900">
                        Payment Details
                    </h2>

                    <div class="space-y-5">

                        <!-- Card Number -->
                        <div>

                            <label for="number"
                                class="mb-2 flex items-center gap-2 text-sm font-semibold text-slate-700">
                                <svg class="h-5 w-5 shrink-0 text-blue-700" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="2" y="5" width="20" height="14" rx="2" />
                                    <path d="M2 10h20" />
                                </svg>
                                Card Number
                            </label>

                            <div id="number" class="grid grid-cols-4 gap-2">

                                <input type="text" inputmode="numeric" maxlength="4" placeholder="0000"
                                    aria-label="First four digits"
                                    class="min-w-0 w-full rounded-xl border border-slate-200 bg-slate-50 px-1 py-3 text-center text-sm font-semibold tracking-wider outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                                <input type="text" inputmode="numeric" maxlength="4" placeholder="0000"
                                    aria-label="Second four digits"
                                    class="min-w-0 w-full rounded-xl border border-slate-200 bg-slate-50 px-1 py-3 text-center text-sm font-semibold tracking-wider outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                                <input type="text" inputmode="numeric" maxlength="4" placeholder="0000"
                                    aria-label="Third four digits"
                                    class="min-w-0 w-full rounded-xl border border-slate-200 bg-slate-50 px-1 py-3 text-center text-sm font-semibold tracking-wider outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                                <input type="text" inputmode="numeric" maxlength="4" placeholder="0000"
                                    aria-label="Last four digits"
                                    class="min-w-0 w-full rounded-xl border border-slate-200 bg-slate-50 px-1 py-3 text-center text-sm font-semibold tracking-wider outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                            </div>
                        </div>

                        <!-- Expiry and Name -->
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                            <!-- Expiry -->
                            <div>

                                <label class="mb-2 flex items-center gap-2 text-sm font-semibold text-slate-700">
                                    <svg class="h-5 w-5 shrink-0 text-blue-700" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect x="3" y="5" width="18" height="16" rx="2" />
                                        <path d="M16 3v4M8 3v4M3 11h18" />
                                    </svg>
                                    Expiry Date
                                </label>

                                <div class="flex gap-2">

                                    <input id="year" type="text" inputmode="numeric" maxlength="2" placeholder="YY"
                                        aria-label="Expiry year"
                                        class="min-w-0 w-1/2 rounded-xl border border-slate-200 bg-slate-50 px-2 py-3 text-center text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                                    <input id="month" type="text" inputmode="numeric" maxlength="2" placeholder="MM"
                                        aria-label="Expiry month"
                                        class="min-w-0 w-1/2 rounded-xl border border-slate-200 bg-slate-50 px-2 py-3 text-center text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                                </div>
                            </div>

                            <!-- Card Holder -->
                            <div>

                                <label for="cardHolder"
                                    class="mb-2 flex items-center gap-2 text-sm font-semibold text-slate-700">
                                    <svg class="h-5 w-5 shrink-0 text-blue-700" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="8" r="4" />
                                        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                                    </svg>
                                    Account Name
                                </label>

                                <input id="cardHolder" type="text" placeholder="Your name" autocomplete="cc-name"
                                    class="w-full min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                            </div>

                        </div>

                        <!-- CVV2 -->
                        <div>

                            <label for="cvv" class="mb-2 flex items-center gap-2 text-sm font-semibold text-slate-700">
                                <svg class="h-5 w-5 shrink-0 text-blue-700" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="5" width="18" height="14" rx="2" />
                                    <path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" />
                                </svg>
                                CVV2
                            </label>

                            <input id="cvv" type="password" inputmode="numeric" maxlength="4"
                                placeholder="Enter security code" autocomplete="off"
                                class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">

                        </div>

                        <!-- Save Card Option -->
                        <div
                            class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 p-4">

                            <label for="saveCard" class="flex cursor-pointer items-center gap-3">
                                <input type="checkbox" id="saveCard"
                                    class="h-4 w-4 shrink-0 cursor-pointer accent-blue-700">

                                <span>
                                    <span class="block text-sm font-semibold text-slate-800">
                                        Save this card
                                    </span>

                                    <span class="mt-1 block text-xs text-slate-500">
                                        Save card details for quick access
                                    </span>
                                </span>
                            </label>

                            <svg class="h-6 w-6 shrink-0 text-blue-700" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 3h12l4 4v14H3V3h2z" />
                                <path d="M7 3v6h10V3M7 21v-7h10v7" />
                            </svg>

                        </div>

                        <!-- Add Card Button -->
                        <button type="button" id="addCardButton"
                            class="flex w-full items-center justify-center gap-2 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700 transition hover:border-blue-300 hover:bg-blue-100 active:scale-[0.99]">

                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14" />
                            </svg>

                            Add New Card
                        </button>

                        <!-- Pay Button -->
                        <button id="payButton" type="button"
                            class="flex w-full items-center justify-center gap-3 rounded-xl bg-blue-700 px-5 py-4 font-semibold text-white shadow-lg shadow-blue-700/20 transition duration-200 hover:-translate-y-0.5 hover:bg-blue-800 hover:shadow-xl hover:shadow-blue-700/25 active:translate-y-0 focus:outline-none focus:ring-4 focus:ring-blue-500/20">

                            <span>Continue to Payment</span>

                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>

                        </button>

                    </div>

                </section>

            </div>

            <!-- Footer -->
            <footer class="mt-6 flex items-center justify-center gap-2 text-xs text-slate-400">

                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="11" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>

                <span>Secure checkout demo</span>

            </footer>

        </div>

    </main>


</body>
<script>
    const cardNumber = document.querySelector('#cardNumber')
    const inpCard = document.querySelectorAll('#number>input')
    const cv = document.querySelector('#cvv')
    const yearCard = document.querySelector('#cardYear')
    const monthCard = document.querySelector('#cardMonth')
    const monthinp = document.querySelector('#month')
    const yearinp = document.querySelector('#year')
    const cardName = document.querySelector('#name')
    const cardNameInp = document.querySelector('#cardHolder')
    const saveCard = document.getElementById("saveCard")
    const addCardButton = document.getElementById("addCardButton")
    const cardList = document.getElementById("cardList")
    let cards = JSON.parse(localStorage.getItem('cards')) || []

    inpCard.forEach((val, i) => {
        val.addEventListener('input', () => {
            if (val.value.length >= 4) {
                if (i != 3) {
                    val.value = val.value.slice(0, 4)
                    val.nextElementSibling.focus()
                } else {
                    yearinp.focus()
                }
            }
            // update h2//
            cardNumber.innerHTML = ''
            inpCard.forEach((item, i) => {
                if (item.value != '') {
                    if (item.value.length != 4) {
                        cardNumber.innerHTML += item.value
                    } else {
                        if (i != 3) {
                            cardNumber.innerHTML += item.value + '<b> - </b>'
                        } else {
                            cardNumber.innerHTML += item.value
                        }
                    }
                }
            })
        })
    })
    yearinp.addEventListener('input', () => {
        yearCard.innerText = yearinp.value

        if (yearinp.value.length >= 2) {
            monthinp.focus();
        }
    })

    monthinp.addEventListener('input', () => {
        monthCard.innerText = monthinp.value;

        if (monthinp.value.length >= 2) {
            cardNameInp.focus()
        }
    })

    cardNameInp.addEventListener('input', () => {
        cardName.innerText = cardNameInp.value

    })

    // Create element by card

    function showCards() {
        cardList.innerHTML = ''

        cards.forEach((card) => {
            let li = document.createElement('li')
            li.innerText = `${card.name} - ${card.number}`
            li.addEventListener('click', () => {
                cardNameInp.value = card.name
                cardName.innerText = card.name
                const numberParts = card.number.match(/.{1,4}/g) || []
                inpCard.forEach((val, i) => {
                    val.value = numberParts[i] || ''
                })
                monthinp.value = card.month || ''
                yearinp.value = card.year || ''
                monthCard.innerText = monthinp.value || 'MM'
                yearCard.innerText = yearinp.value || 'YY'
                cardNumber.innerHTML = ''
                inpCard.forEach((val, i) => {
                    if (val.value !== '') {
                        cardNumber.innerHTML += val.value
                        if (i < 3 && val.value !== '') {
                            cardNumber.innerHTML += ' <b> - </b> '
                        }
                    }
                })
            })

            cardList.appendChild(li)
        })
    }

    addCardButton.addEventListener('click', () => {

        if (saveCard.checked) {
            const name = cardNameInp.value.trim()

            const number = Array.from(inpCard)
                .map((item) => item.value)
                .join('')

            if (name === '' || number.length !== 16) {
                alert('Please enter your name and complete card number.')
                return
            }


            const card = {
                name: name,
                number: number,
                month: monthinp.value,
                year: yearinp.value
            }


            cards.push(card)

            localStorage.setItem('cards', JSON.stringify(cards))

            showCards()

            console.log('Card saved successfully!')
        } else {
            alert('Please check Save this card first.')
        }
    })

    showCards()
    
</script>

</html>
